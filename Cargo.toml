[package]
name = "yandex-music-tui"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
crossterm = "0.29.0"
dirs = "7.0.0"
hmac = "0.12.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
mpris-server = { version = "0.11.0", features = ["tokio"] }
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json", "rustls", "query", "form"] }
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
symphonia = { version = "0.6.1", features = ["all"] }
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
unicode-width = "0.2.3"

[profile.release]
strip = true
